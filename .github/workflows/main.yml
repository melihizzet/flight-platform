name: UçGit Fiyat Alarmı

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Fiyat alarmlarını kontrol et
        run: |
          echo "UçGit fiyat alarmı kontrolü başladı."
          curl -s "https://www.ucgit.com/api/flight-price"
