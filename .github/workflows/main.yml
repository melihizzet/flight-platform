name: UçGit Fiyat Alarmı

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Supabase bağlantısını test et
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          set -e

          echo "======================================"
          echo "UçGit Supabase bağlantı testi"
          echo "======================================"

          HTTP_RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept: application/json" \
            "$SUPABASE_URL/rest/v1/price_alerts?select=id,active&active=eq.true")

          BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)

          echo "HTTP durumu: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Supabase hata cevabı:"
            echo "$BODY"
            exit 1
          fi

          echo "Supabase bağlantısı başarılı."

          echo "Dönen kayıt tipi:"
          echo "$BODY" | jq -r 'type'

          echo "Aktif alarm sayısı:"
          echo "$BODY" | jq 'length'

          echo "Aktif alarm ID'leri:"
          echo "$BODY" | jq -r '.[].id'

          echo "Aktif değerleri:"
          echo "$BODY" | jq -r '.[].active'

          echo "======================================"
          echo "Test tamamlandı."
          echo "======================================"
